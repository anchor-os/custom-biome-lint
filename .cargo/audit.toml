[advisories]
# RUSTSEC-2024-0370: proc-macro-error is unmaintained.
#
# Pulled in transitively by biome_diagnostics_macros and biome_markup, both
# proc-macro crates pinned to =0.5.7 (see the pin note in Cargo.toml — bumping
# past 0.5.7 requires biome_rowan 0.5.8, a breaking change). Neither crate has
# been republished since 2024-03-12 even though sibling biome_* crates moved
# to 0.5.8, so there is no newer release upstream that drops proc-macro-error.
#
# Not a runtime concern: both are (proc-macro) dependencies, meaning they run
# only during `cargo build` to generate code — neither ships inside the
# compiled custom-biome-lint binary.
ignore = ["RUSTSEC-2024-0370"]
