# Supply-chain policy for `cargo deny check`. Trimmed to what this project
# actually needs — see https://embarkstudios.github.io/cargo-deny/ for the
# full set of options this omits.

[graph]
all-features = false
no-default-features = false

[advisories]
# Mirrors .cargo/audit.toml. Biome's procedural-macro crates
# (biome_deserialize_macros, biome_diagnostics_macros, biome_markup) transitively
# pull in proc-macro-error2, which is unmaintained with no safe upgrade
# (RUSTSEC-2026-0173). It is used by procedural macros, so it is NOT linked into
# the compiled custom-biome-lint binary — but it still executes on the build host
# while those macros are compiled, giving it build-time (not runtime) access.
# Biome itself is pinned to a git rev (see Cargo.toml), so the only fix is an
# upstream Biome release that drops proc-macro-error2.
ignore = [
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: build-time-only proc-macro used by biome_* macros, unmaintained, transitive, no safe upgrade" },
]

[licenses]
# Every license actually present in the dependency tree today, all
# permissive. Adding a dependency under a different license is meant to fail
# this check until it's deliberately added here.
allow = [
    "MIT",
    "Apache-2.0",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "MIT-0",
    "Zlib",
    "Unlicense",
]
# option-ext (MPL-2.0) is the only copyleft-licensed crate in the graph — a
# benign build-time dependency pulled in transitively by Biome 2.5.8. It is
# scoped here rather than widening the global allow list to MPL-2.0, so any
# other crate introducing MPL-2.0 would still fail this check.
exceptions = [
    { name = "option-ext", version = "0.2.0", allow = ["MPL-2.0"] },
]
confidence-threshold = 0.8

[licenses.private]
# This crate is not published, so its own (MIT) license need not appear
# in the allow list above.
ignore = true

[bans]
# Duplicate versions are common in a graph this size and not a policy
# violation on their own — warn so they're visible without failing CI.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Biome is consumed as a git dependency (see Cargo.toml); allow this one git
# source so the supply-chain check knows it's an expected, reviewed source.
allow-git = ["https://github.com/biomejs/biome"]
# Every allowed git dependency must be pinned to an immutable `rev` (commit),
# not a moving branch or tag, so the check rejects git deps that could change
# underneath us. Biome is pinned by `rev` in Cargo.toml.
required-git-spec = "rev"
