[package]
name = "custom-biome-lint"
version = "0.4.4"
edition = "2021"
description = "Standalone linting tool for Reselect/Redux patterns not in Biome"
license = "MIT"
repository = "https://github.com/anchor-os/custom-biome-lint"
readme = "README.md"

[lib]
name = "custom_biome_lint"
path = "src/lib.rs"

[[bin]]
name = "custom-biome-lint"
path = "src/bin/custom-biome-lint.rs"

# Biome is consumed from git: the standalone `biome_js_parser`/`biome_js_syntax`
# crates on crates.io are frozen at 0.5.7 (pre-1.0), which cannot parse `$`-prefixed
# identifiers (e.g. the Cypress `$el` convention). Modern Biome (1.x/2.x) is only
# published via the monorepo, so we pin all four direct crates—
# biome_js_parser, biome_js_syntax, biome_rowan, and biome_languages—to one commit
# to keep the graph unified. All four are used directly.
[dependencies]
# `version` is required alongside `rev` so cargo-deny's `wildcards` lint sees a
# concrete version rather than treating the git source as a wildcard. Biome's
# per-crate versions are pinned at 0.5.7 / 0.1.0 across the 2.x line, so these
# stay valid when the `rev` is bumped within 2.x.
biome_js_parser = { git = "https://github.com/biomejs/biome", rev = "208146010946ce47fb9396b9a2d6c9b9226e2d25", version = "0.5.7" }
biome_js_syntax = { git = "https://github.com/biomejs/biome", rev = "208146010946ce47fb9396b9a2d6c9b9226e2d25", version = "0.5.7" }
biome_rowan = { git = "https://github.com/biomejs/biome", rev = "208146010946ce47fb9396b9a2d6c9b9226e2d25", version = "0.5.7" }
biome_languages = { git = "https://github.com/biomejs/biome", rev = "208146010946ce47fb9396b9a2d6c9b9226e2d25", version = "0.1.0" }
serde_json = "1"
rayon = "1.7"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
