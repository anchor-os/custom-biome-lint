[package]
name = "custom-biome-lint"
version = "0.4.0"
edition = "2021"
description = "Standalone linting tool for Reselect/Redux patterns not in Biome"
license = "MIT"
repository = "https://github.com/anchor-os/custom-biome-lint"
readme = "README.md"

[lib]
name = "custom_biome_lint"
path = "src/lib.rs"

[[bin]]
name = "custom-biome-lint"
path = "src/bin/custom-biome-lint.rs"

# Biome is consumed from git: the standalone `biome_js_parser`/`biome_js_syntax`
# crates on crates.io are frozen at 0.5.7 (pre-1.0), which cannot parse `$`-prefixed
# identifiers (e.g. the Cypress `$el` convention). Modern Biome (1.x/2.x) is only
# published via the monorepo, so we pin all three crates to one commit to keep the
# graph unified. Only the parser/source/rowan crates are used directly.
[dependencies]
biome_js_parser = { git = "https://github.com/biomejs/biome", rev = "6b8f09c04394f2a9f72b89f9381724681169641a" }
biome_js_syntax = { git = "https://github.com/biomejs/biome", rev = "6b8f09c04394f2a9f72b89f9381724681169641a" }
biome_rowan = { git = "https://github.com/biomejs/biome", rev = "6b8f09c04394f2a9f72b89f9381724681169641a" }
biome_languages = { git = "https://github.com/biomejs/biome", rev = "6b8f09c04394f2a9f72b89f9381724681169641a" }
serde_json = "1"
rayon = "1.7"

[dev-dependencies]
tempfile = "3.8"

[profile.release]
opt-level = 3
