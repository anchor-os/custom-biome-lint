name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# id-token: write is required for npm trusted publishing (OIDC). The publish
# happens without any NPM_TOKEN secret; npm exchanges the runner's short-lived
# OIDC token for a publish-scoped credential.
#
# deployments: write is required to start a job that targets an environment
# with protection rules (required reviewers) — the runner must create the
# deployment before it can be approved.
permissions:
  id-token: write
  contents: read
  deployments: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Protected environment. Create `npm-publish` in the repository's
    # Environments settings with:
    #   - Required reviewers (and "Prevent self-review")
    #   - Deployment tags restricted to `refs/tags/v*`
    # The tag rule makes a manual workflow_dispatch on a branch fail outright,
    # so a release can only ship from a v* tag after approval.
    # The npm trusted publisher for `custom-biome-lint` must use the identical
    # environment name "npm-publish", or the OIDC token exchange is rejected.
    environment: npm-publish
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.4.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Trusted publishing (OIDC) requires npm >= 11.5.1; pin an exact version.
      - name: Install npm 11.18.0 (OIDC support)
        run: npm install -g npm@11.18.0 --force

      # setup-node with registry-url writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
      # With no NODE_AUTH_TOKEN secret the placeholder expands to empty, which makes npm treat
      # auth as configured and skip the OIDC handshake (fails with ENEEDAUTH). Strip the line so
      # trusted publishing kicks in.
      - name: Strip empty _authToken from .npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build (release)
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Smoke test against fixtures
        # fixtures/ deliberately contains violations, so the binary is expected
        # to exit 1. Also assert the documented fixture contract (11 errors in
        # 6 files) so the counts cannot silently drift before a publish.
        run: |
          set +e
          output="$(./target/release/custom-biome-lint fixtures)"
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (violations found), got $code"
            exit 1
          fi
          if ! grep -q "11 errors in 6 files" <<<"$output"; then
            echo "expected fixture summary '11 errors in 6 files':"
            echo "$output" | tail -n 1
            exit 1
          fi

      # --loglevel verbose surfaces the OIDC exchange result (npm logs it only
      # at verbose level and otherwise swallows it into a bare ENEEDAUTH).
      - name: Publish to npm
        run: npm publish --access public --provenance --loglevel verbose
