name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# id-token: write is required for npm trusted publishing (OIDC), used by both
# the platform-package publishes and the main-package publish below. The
# publish happens without any NPM_TOKEN secret; npm exchanges the runner's
# short-lived OIDC token for a publish-scoped credential. Each of the 9
# packages (8 platform + main) needs its own npm trusted publisher entry
# configured on npmjs.com pointing at this workflow + the npm-publish
# environment. A package whose trusted publisher is missing fails the publish
# job outright — the two musl packages are brand new and need theirs
# bootstrapped before the first release that includes them (see
# docs/PUBLISH_TO_NPM.md#first-time-bootstrap-a-brand-new-package-name).
#
# deployments: write is required to start a job that targets an environment
# with protection rules (required reviewers) — the runner must create the
# deployment before it can be approved.
permissions:
  id-token: write
  contents: read
  deployments: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.97.1"
  NODE_VERSION: "26.4.0"

jobs:
  # Establishes the release version once, from the tag, before anything is
  # built. This must happen first: the binary embeds its version at compile
  # time via `env!("CARGO_PKG_VERSION")` (see src/cli/mod.rs), so if the
  # version were only synced into Cargo.toml later (in the publish job, as
  # this workflow used to do), every binary would already be built and
  # baked with whatever version happened to be committed — not the tag's
  # version. There is exactly one version source (the tag); this job just
  # makes it available to the jobs that need it.
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Derive release version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "refusing to publish: '$GITHUB_REF_NAME' is not a v<major>.<minor>.<patch> tag"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Builds a precompiled binary for every supported platform/arch. Every leg
  # first syncs Cargo.toml (and the package.json files, unused here but kept
  # in lockstep by the same single script) to the release version, so the
  # binary it builds embeds that exact version — see the comment on
  # determine-version above. Native targets (host arch/os matches the build
  # target) run the full test suite, the fixtures smoke test, and a
  # `--version` check against the binary they just built. win32-arm64 now
  # builds natively on a windows-11-arm runner rather than cross-compiling
  # from windows-latest (x64): cross-compiling to aarch64-pc-windows-msvc
  # needs the ARM64 MSVC linker/libraries and the right INCLUDE/LIB/PATH
  # environment active, which `rustup target add` alone does not set up, and
  # a native runner sidesteps that failure mode entirely. linux-arm64 remains
  # cross-compiled (ubuntu-22.04 x64 host, via `gcc-aarch64-linux-gnu`) and is
  # limited to an architecture check on the produced artifact, as are the two
  # musl legs (see the "Install cross" step for why they use `cross`).
  build:
    needs: determine-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            target: aarch64-apple-darwin
            os: macos-14 # Apple Silicon runner: native aarch64
            node_os: darwin
            can_run: true
          - platform: darwin-x64
            target: x86_64-apple-darwin
            os: macos-15-intel # Intel runner: native x86_64
            node_os: darwin
            can_run: true
          - platform: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            node_os: linux
            can_run: true
          - platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04 # x64 host; cross-compiled via apt gcc-aarch64-linux-gnu
            node_os: linux
            can_run: false
            cross_linux_arm64: true
          # musl legs: statically linked binaries for Alpine and other
          # musl-based images. Both are built inside a `cross` container, so
          # neither is treated as natively runnable on this glibc x64 runner —
          # see the "Install cross" step.
          - platform: linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            node_os: linux
            can_run: false
            use_cross: true
            elf_arch: x86-64
          - platform: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-22.04 # x64 host; cross-compiled inside a cross container
            node_os: linux
            can_run: false
            use_cross: true
            elf_arch: ARM aarch64
          - platform: win32-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            node_os: win32
            can_run: true
          - platform: win32-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm # native ARM64 runner: avoids MSVC cross-compilation
            node_os: win32
            can_run: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set release version before building
        shell: bash
        run: node scripts/set-version.js "${{ needs.determine-version.outputs.version }}"

      - name: Install aarch64-linux-gnu cross toolchain
        if: matrix.cross_linux_arm64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # `cross` (Docker images carrying real musl cross toolchains) rather than
      # `rustup target add` plus apt linkers, for both musl legs:
      # x86_64-unknown-linux-musl would mostly work with `musl-tools` alone,
      # but aarch64-unknown-linux-musl has no Ubuntu cross-gcc package — the
      # available `gcc-aarch64-linux-gnu` targets glibc, and pointing the musl
      # target's linker at it is exactly the class of half-configured
      # cross-linking that already cost this workflow a Windows ARM64 rewrite.
      # One mechanism for both legs also means one place to fix if it breaks.
      # Pinned to a release binary rather than `cargo install cross` so a
      # release build does not depend on compiling a build tool from source.
      # Pinned by version *and* content digest, then verified before anything is
      # extracted. Piping a download straight into `sudo tar` would let a
      # compromised or swapped release artifact write executables into
      # /usr/local/bin on the runner that builds the binaries this project
      # ships — the same reason every action above is pinned by commit SHA
      # rather than by tag. Digest recorded 2026-08-14 for
      # cross-rs/cross v0.2.5 cross-x86_64-unknown-linux-gnu.tar.gz; it must be
      # updated deliberately whenever CROSS_VERSION changes, and a mismatch
      # fails the release rather than warning.
      - name: Install cross (musl legs)
        if: matrix.use_cross
        env:
          CROSS_VERSION: v0.2.5
          CROSS_SHA256: 642375d1bcf3bd88272c32ba90e999f3d983050adf45e66bd2d3887e8e838bad
        run: |
          set -euo pipefail
          archive="$(mktemp -d)/cross.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/cross-rs/cross/releases/download/${CROSS_VERSION}/cross-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"
          echo "${CROSS_SHA256}  ${archive}" | sha256sum --check --strict -
          sudo tar -xz -C /usr/local/bin -f "$archive" cross cross-util
          cross --version

      - name: Build (release)
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Test (native targets only)
        if: matrix.can_run
        shell: bash
        run: cargo test --release --target ${{ matrix.target }}

      - name: Smoke test against fixtures (native targets only)
        # fixtures/ deliberately contains violations, so the binary is expected
        # to exit 1. Also assert the documented fixture contract (52 errors in
        # 10 files) so the counts cannot silently drift before a publish.
        if: matrix.can_run
        shell: bash
        run: |
          set +e
          bin="target/${{ matrix.target }}/release/custom-biome-lint"
          if [ "${{ matrix.node_os }}" = "win32" ]; then
            bin="$bin.exe"
          fi
          output="$("$bin" fixtures)"
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (violations found), got $code"
            exit 1
          fi
          # Anchored on non-digits at both ends: a plain substring match would
          # also accept "152 errors in 10 files" or "52 errors in 110 files",
          # letting the documented counts drift past this gate.
          if ! grep -Eq '(^|[^0-9])52 errors in 10 files([^0-9]|$)' <<<"$output"; then
            echo "expected fixture summary '52 errors in 10 files':"
            echo "$output" | tail -n 1
            exit 1
          fi

      - name: Verify binary reports the release version (native targets only)
        if: matrix.can_run
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          bin="target/${{ matrix.target }}/release/custom-biome-lint"
          if [ "${{ matrix.node_os }}" = "win32" ]; then
            bin="$bin.exe"
          fi
          expected="custom-biome-lint $version"
          actual="$("$bin" --version)"
          if [ "$actual" != "$expected" ]; then
            echo "expected --version to print '$expected', got '$actual'"
            exit 1
          fi

      - name: Verify architecture of cross-compiled Linux binary
        if: matrix.platform == 'linux-arm64'
        run: |
          file target/aarch64-unknown-linux-gnu/release/custom-biome-lint
          file target/aarch64-unknown-linux-gnu/release/custom-biome-lint | grep -q "ARM aarch64"

      # The musl legs cannot be executed here (they are built in a cross
      # container and, for arm64, for another architecture entirely), so this
      # is the only check they get. Static linking is the whole point of these
      # two packages: a musl binary that came out dynamically linked would fail
      # on Alpine in exactly the way the glibc binary already does, which is
      # the bug these packages exist to fix.
      - name: Verify the musl binary is statically linked and correctly targeted
        if: matrix.use_cross
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/custom-biome-lint"
          file "$bin"
          file "$bin" | grep -q "${{ matrix.elf_arch }}"
          if ! file "$bin" | grep -Eq "static-pie linked|statically linked"; then
            echo "expected a statically linked musl binary"
            exit 1
          fi
          if ldd "$bin" 2>&1 | grep -q "libc.so.6"; then
            echo "musl binary still links against glibc's libc.so.6"
            exit 1
          fi

      # Kept even though win32-arm64 now builds natively (not cross-compiled):
      # Windows 11 on ARM64 transparently emulates x64 binaries, so a binary
      # that runs successfully is not on its own proof that it's actually
      # ARM64 — the `--version` check above would pass just as well under
      # emulation. This inspects the PE header directly instead.
      - name: Verify architecture of the win32-arm64 binary
        if: matrix.platform == 'win32-arm64'
        shell: pwsh
        run: |
          $path = "target/aarch64-pc-windows-msvc/release/custom-biome-lint.exe"
          $bytes = [System.IO.File]::ReadAllBytes($path)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0xAA64) {
            throw "expected ARM64 PE header (0xAA64), got 0x$($machine.ToString('X'))"
          }
          Write-Host "Verified ARM64 PE header (machine=0x$($machine.ToString('X')))"

      - name: Stage binary for upload
        shell: bash
        run: |
          mkdir -p dist
          src="target/${{ matrix.target }}/release/custom-biome-lint"
          if [ "${{ matrix.node_os }}" = "win32" ]; then
            cp "$src.exe" dist/custom-biome-lint.exe
          else
            cp "$src" dist/custom-biome-lint
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # Assembles the platform npm packages from the artifacts built above, syncs
  # every package.json + Cargo.toml to the release version determined above,
  # copies each binary into its `npm/<platform>/bin/`, then publishes the eight
  # platform packages followed by the main package. The main package must
  # publish last, since its optionalDependencies pin the exact versions the
  # platform packages just published under.
  publish:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    # Protected environment. Create `npm-publish` in the repository's
    # Environments settings with:
    #   - Required reviewers (and "Prevent self-review")
    #   - Deployment tags restricted to `refs/tags/v*`
    # The tag rule makes a manual workflow_dispatch on a branch fail outright,
    # so a release can only ship from a v* tag after approval.
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binary-*
          path: artifacts

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false # never cache in release builds

      # Trusted publishing (OIDC) requires npm >= 11.5.1; pin an exact version.
      - name: Install npm 11.18.0 (OIDC support)
        run: npm install -g npm@11.18.0 --force

      # setup-node with registry-url writes `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`.
      # With no NODE_AUTH_TOKEN secret the placeholder expands to empty, which makes npm treat
      # auth as configured and skip the OIDC handshake (fails with ENEEDAUTH). Strip the line so
      # trusted publishing kicks in.
      - name: Strip empty _authToken from .npmrc
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          sed -i '/_authToken/d' "$npmrc"

      - name: Sync Cargo.toml + package.json versions
        run: node scripts/set-version.js "${{ needs.determine-version.outputs.version }}"

      # Explicit release gate, independent of set-version.js's own internal
      # checks: reads back every manifest set-version.js just wrote and
      # asserts it reports the release version, so a future change to that
      # script (or a manifest edited by hand after this step) can't silently
      # ship a mismatched version.
      - name: Verify package manifests report the release version
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          node -e '
            const fs = require("fs");
            const version = process.argv[1];
            const platforms = ["darwin-arm64","darwin-x64","linux-arm64","linux-arm64-musl","linux-x64","linux-x64-musl","win32-arm64","win32-x64"];
            const mismatches = [];

            const cargoVersion = fs.readFileSync("Cargo.toml", "utf8").match(/^version = "([^"]*)"/m)?.[1];
            if (cargoVersion !== version) mismatches.push(`Cargo.toml: ${cargoVersion}`);

            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (rootPkg.version !== version) mismatches.push(`package.json version: ${rootPkg.version}`);
            for (const platform of platforms) {
              const dep = rootPkg.optionalDependencies?.[`custom-biome-lint-${platform}`];
              if (dep !== version) mismatches.push(`package.json optionalDependencies[custom-biome-lint-${platform}]: ${dep}`);
            }

            for (const platform of platforms) {
              const pkg = JSON.parse(fs.readFileSync(`npm/${platform}/package.json`, "utf8"));
              if (pkg.version !== version) mismatches.push(`npm/${platform}/package.json: ${pkg.version}`);
            }

            if (mismatches.length > 0) {
              console.error(`refusing to publish: expected ${version} everywhere, found:\n  ${mismatches.join("\n  ")}`);
              process.exit(1);
            }
            console.log(`all manifests report ${version}`);
          ' "$version"

      - name: Stage binaries into platform packages
        run: |
          set -euo pipefail
          declare -A unix_platforms=(
            [darwin-arm64]=1 [darwin-x64]=1 [linux-arm64]=1 [linux-arm64-musl]=1
            [linux-x64]=1 [linux-x64-musl]=1
          )
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-arm64-musl linux-x64 linux-x64-musl win32-arm64 win32-x64; do
            mkdir -p "npm/$platform/bin"
            if [[ -n "${unix_platforms[$platform]:-}" ]]; then
              cp "artifacts/binary-$platform/custom-biome-lint" "npm/$platform/bin/custom-biome-lint"
              chmod +x "npm/$platform/bin/custom-biome-lint"
            else
              cp "artifacts/binary-$platform/custom-biome-lint.exe" "npm/$platform/bin/custom-biome-lint.exe"
            fi
          done

      # Final gate before anything is published: prove a staged binary
      # actually reports the release version, not just that its manifest
      # says so. linux-x64 is the artifact this glibc ubuntu-latest job runs
      # directly; the musl artifacts are deliberately not executed here (see
      # docs/DISTRIBUTION.md#limitations).
      - name: Verify a staged binary reports the release version
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          expected="custom-biome-lint $version"
          actual="$(npm/linux-x64/bin/custom-biome-lint --version)"
          if [ "$actual" != "$expected" ]; then
            echo "expected --version to print '$expected', got '$actual'"
            exit 1
          fi

      # Restart-safe: a rerun after a partial failure (e.g. 3 of 8 platform
      # packages published, then a transient registry error) must not fail on
      # the versions that already went out — published versions are
      # immutable, so re-publishing the same version is not just unnecessary,
      # it's an error. Skip only an exact version match; any other npm error
      # (bad auth, network) still fails the step.
      - name: Publish platform packages
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-arm64-musl linux-x64 linux-x64-musl win32-arm64 win32-x64; do
            pkg="custom-biome-lint-$platform"
            if npm view "$pkg@$version" version >/dev/null 2>&1; then
              echo "::notice::$pkg@$version already on the registry, skipping (restart after partial failure)"
              continue
            fi
            echo "::group::Publishing $pkg"
            (cd "npm/$platform" && npm publish --access public --provenance --loglevel verbose)
            echo "::endgroup::"
          done

      # Belt-and-suspenders check, independent of how the loop above got each
      # package there (published just now, or already present from an earlier
      # attempt of this same release): the main package's optionalDependencies
      # pin all eight exact versions, so publishing it before every platform
      # package actually exists at that version would ship a main package
      # whose install can never succeed on the missing platform(s).
      #
      # Retries with backoff: npm's registry is CDN/replica-backed, so a
      # `npm view` immediately after a successful `npm publish` can briefly
      # 404 on read-after-write lag even though the publish itself already
      # succeeded (observed for real: custom-biome-lint-win32-x64@0.2.1
      # published cleanly but wasn't visible to this check ~30s later, and
      # was visible on a rerun a couple of minutes after that). A single
      # immediate check can't tell "still propagating" apart from "actually
      # failed to publish," so poll instead of failing on the first miss.
      - name: Verify all platform packages are on the registry
        run: |
          set -euo pipefail
          version="${{ needs.determine-version.outputs.version }}"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-arm64-musl linux-x64 linux-x64-musl win32-arm64 win32-x64; do
            pkg="custom-biome-lint-$platform"
            attempt=1
            max_attempts=15
            until npm view "$pkg@$version" version >/dev/null 2>&1; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                echo "::error::$pkg@$version is not on the registry after $max_attempts attempts; refusing to publish the main package"
                exit 1
              fi
              echo "::notice::$pkg@$version not visible yet (registry propagation lag?), retrying in 6s (attempt $attempt/$max_attempts)"
              attempt=$((attempt + 1))
              sleep 6
            done
          done

      # --loglevel verbose surfaces the OIDC exchange result (npm logs it only
      # at verbose level and otherwise swallows it into a bare ENEEDAUTH).
      - name: Publish main package
        run: npm publish --access public --provenance --loglevel verbose
