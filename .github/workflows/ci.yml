name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build (release)
        run: cargo build --release --verbose

      - name: Test
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Smoke test against fixtures
        # fixtures/ deliberately contains violations (invalid.js per rule), so
        # the binary is expected to exit 1. Any other exit code (0 = found
        # nothing, 2 = usage/crash) means something is actually broken.
        run: |
          set +e
          ./target/release/custom-biome-lint fixtures
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (violations found), got $code"
            exit 1
          fi

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Installs prebuilt cargo-audit/cargo-deny binaries instead of
      # compiling them from source, which would otherwise cost several
      # minutes per run for tools that aren't part of the shipped package.
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-audit,cargo-deny

      - name: Audit (RUSTSEC advisories)
        run: cargo audit

      - name: Deny (licenses, bans, sources)
        run: cargo deny check
